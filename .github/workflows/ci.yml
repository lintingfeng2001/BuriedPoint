name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-mingw64:
    name: Windows MinGW64
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DBUILD_BURIED_TEST=ON
          -DBUILD_BURIED_EXAMPLES=ON

      - name: Build
        run: cmake --build build/ci --parallel 4

      - name: Run tests
        run: ./build/ci/tests/buried_test.exe --gtest_color=yes

      - name: Run context example
        run: ./build/ci/examples/context_example.exe

  windows-clang-cl-asan:
    name: Windows clang-cl ASan
    runs-on: windows-2022
    timeout-minutes: 25

    env:
      ASAN_OPTIONS: halt_on_error=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure ASan
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs_path = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.ASAN `
            -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang `
            -property installationPath
          if (-not $vs_path) {
            throw 'Visual Studio clang-cl and AddressSanitizer were not found'
          }
          & "$vs_path\Common7\Tools\Launch-VsDevShell.ps1" `
            -Arch amd64 -SkipAutomaticLocation
          cmake --preset clang-cl-asan

      - name: Build ASan
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs_path = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.ASAN `
            -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang `
            -property installationPath
          & "$vs_path\Common7\Tools\Launch-VsDevShell.ps1" `
            -Arch amd64 -SkipAutomaticLocation
          cmake --build --preset clang-cl-asan

      - name: Configure ASan runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs_path = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.ASAN `
            -property installationPath
          if (-not $vs_path) {
            throw 'Visual Studio AddressSanitizer component was not found'
          }

          $runtime_pattern = Join-Path $vs_path `
            'VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll'
          $asan_runtime = Get-ChildItem -Path $runtime_pattern -File |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $asan_runtime) {
            throw 'The x64 AddressSanitizer runtime was not found'
          }

          "Path=$($asan_runtime.DirectoryName);$env:Path" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_SYMBOLIZER_PATH=$vs_path\VC\Tools\Llvm\x64\bin\llvm-symbolizer.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run ASan tests
        run: .\build\clang-cl-asan\tests\buried_test.exe --gtest_color=yes

      - name: Run ASan context example
        run: .\build\clang-cl-asan\examples\context_example.exe
